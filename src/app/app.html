<main class="page-shell">
  <h1>Mano užrašinė</h1>

  @if (loading()) {
    <p class="status" role="status">Kraunami užrašai...</p>
  }
  @if (error()) {
    <div class="alert" role="alert">
      <span>{{ error() }}</span>
      <button type="button" (click)="dismissError()" aria-label="Uždaryti klaidos pranešimą">
        <span aria-hidden="true">×</span>
      </button>
    </div>
  }

  <div class="workspace">
    <app-note-form
      [editingNote]="editingNote()"
      (noteSubmitted)="saveNote($event)"
      (editCancelled)="cancelEdit()"
    />
    <app-note-list
      [notes]="notes()"
      (editRequested)="editNote($event)"
      (deleteRequested)="deleteNote($event)"
    />
  </div>
</main>
